spring:
  application:
    name: chatApp

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b

    openai:
      api-key: xxxx
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.8
logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG