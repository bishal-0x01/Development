spring:
  application:
    name: chatApp

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:1b

    openai:
      api-key: xxxx
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.8
      embedding:
        options:
          model: text-embedding-3-small

    vectorstore:
      pgvector:
        initialize-schema: true

  datasource:
    url: jdbc:postgresql://localhost:5434/my-test-db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver


logging:
  level:
    org.springframework.ai:
      chat.client: DEBUG